<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作手順書ジェネレーター</title>
<link rel="stylesheet" href="fonts.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 400px; font-family: 'Noto Sans JP', sans-serif; background: #0f0f13; color: #e8e8f0; overflow: hidden; }

  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 13px 16px; border-bottom: 1px solid #2a2a3e; display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; background: linear-gradient(135deg, #203864, #162d50); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; box-shadow: 0 0 10px rgba(32,56,100,0.4); }
  .header h1 { font-size: 13px; font-weight: 700; color: #f0f0ff; }
  .header p  { font-size: 10px; color: #6060a0; margin-top: 1px; }

  .status-bar { padding: 8px 16px; background: #13131f; border-bottom: 1px solid #1e1e30; display: flex; align-items: center; justify-content: space-between; }
  .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #7070a0; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #3a3a5a; transition: all 0.3s; }
  .status-dot.recording { background: #e94560; box-shadow: 0 0 7px rgba(233,69,96,0.7); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
  .step-count { font-size: 11px; color: #7070a0; }
  .step-count span { color: #203864; font-weight: 700; }

  .controls { padding: 16px; }

  .btn { width: 100%; padding: 10px 14px; border: none; border-radius: 7px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-record { background: linear-gradient(135deg, #e94560, #c62a47); color: #fff; box-shadow: 0 3px 12px rgba(233,69,96,0.3); }
  .btn-record:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(233,69,96,0.4); }
  .btn-record.active { background: linear-gradient(135deg, #ff6b35, #e94560); }
  .btn-secondary { background: #1e1e30; color: #b0b0d0; border: 1px solid #2a2a3e; }
  .btn-secondary:hover { background: #252538; color: #e0e0f5; border-color: #3a3a5a; }

  .tabs { display: flex; background: #0d0d18; border-top: 1px solid #1e1e30; }
  .tab-btn { flex: 1; padding: 9px 4px; background: none; border: none; color: #5a5a80; font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer; border-top: 2px solid transparent; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tab-btn:hover { color: #9090b8; background: #12121e; }

  /* Title input dialog */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dialog-box { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 20px; width: 320px; }
  .dialog-box h3 { font-size: 13px; font-weight: 700; color: #c0c0e0; margin-bottom: 12px; }
  .dialog-box input[type="text"] { width: 100%; padding: 8px 10px; background: #0d0d18; color: #e0e0f0; border: 1px solid #2a2a4a; border-radius: 6px; font-family: inherit; font-size: 12px; outline: none; margin-bottom: 14px; }
  .dialog-box input[type="text"]:focus { border-color: #4a4a8a; }
  .dialog-btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog-btn-row .btn { width: auto; padding: 7px 18px; font-size: 11px; }

  .toast { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%) translateY(50px); background: #1e1e30; color: #b0ffd0; padding: 7px 14px; border-radius: 16px; font-size: 11px; border: 1px solid #2a5a3a; transition: transform 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">📋</div>
  <div>
    <h1 data-i18n="app.name">操作手順書ジェネレーター</h1>
    <p data-i18n="popup.subtitle">クリック・入力操作を自動キャプチャ</p>
  </div>
  <div style="flex:1"></div>
  <button id="btnLang" style="background:none;border:1px solid #2a2a4a;color:#6060a0;border-radius:4px;font-size:10px;font-family:inherit;padding:3px 8px;cursor:pointer;flex-shrink:0">EN</button>
</div>

<div class="status-bar">
  <div class="status-indicator">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">待機中</span>
  </div>
  <div class="step-count" id="stepCount"></div>
</div>

<div class="controls">
  <button class="btn btn-record" id="btnRecord">
    <span id="recordIcon">⏺</span>
    <span id="recordLabel">記録を開始する</span>
  </button>
</div>

<div class="tabs">
  <button class="tab-btn" id="btnOpenEditor" data-i18n="popup.tab.editor">📂 編集</button>
  <button class="tab-btn" id="btnOpenViewer" data-i18n="popup.tab.viewer">👁 照会</button>
  <button class="tab-btn" id="btnOpenFinalizer" data-i18n="popup.tab.finalizer">📑 最終化</button>
</div>

<!-- Title input dialog -->
<div id="titleDialog" style="display:none">
  <div class="dialog-overlay">
    <div class="dialog-box">
      <h3 data-i18n="popup.dialog.start">タイトルを入力</h3>
      <input type="text" id="titleDialogInput" data-i18n="popup.title.placeholder" data-i18n-target="placeholder" placeholder="操作手順書">
      <div class="dialog-btn-row">
        <button class="btn btn-secondary" id="btnDialogCancel" data-i18n="confirm.cancel">キャンセル</button>
        <button class="btn btn-record" id="btnDialogOk">OK</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
